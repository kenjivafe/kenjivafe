name: Profile stats

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build-stats.mjs", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Satoshi
        continue-on-error: true
        run: |
          curl -fsSL https://api.fontshare.com/v2/fonts/download/satoshi -o /tmp/satoshi.zip
          unzip -qo /tmp/satoshi.zip -d /tmp/satoshi
          FONT=$(find /tmp/satoshi -iname 'Satoshi-Variable.woff2' | head -1)
          [ -z "$FONT" ] && FONT=$(find /tmp/satoshi -iname 'Satoshi-Variable.ttf' | head -1)
          echo "Using $FONT"
          echo "FONT_FILE=$FONT" >> "$GITHUB_ENV"

      - name: Get icons
        run: npm i --no-save --no-package-lock simple-icons

      - name: Build cards
        run: node scripts/build-stats.mjs
        env:
          # A personal token (STATS_TOKEN) also counts private contributions.
          # Falls back to the workflow token, which sees public data only.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git push
