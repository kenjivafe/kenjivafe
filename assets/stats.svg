<svg xmlns="http://www.w3.org/2000/svg" width="410" height="220" viewBox="0 0 410 220" role="img" aria-label="GitHub stats">
<style>
  .t{font:500 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.12em;fill:#8a8a8a}
  .n{fill:#ff3800}
  .lbl{font:400 12px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#8a8a8a}
  .val{font:600 14px Satoshi, Inter, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ededed}
  .big{font:700 34px Satoshi, Inter, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ededed;letter-spacing:-.02em}
  .sub{font:400 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#5a5a5a}
</style>
<rect x=".5" y=".5" width="409" height="219" fill="#0a0a0a" stroke="#1f1f1f"/>
<text x="24" y="34" class="t"><tspan class="n">01</tspan>  GITHUB STATS</text>

<line x1="24" y1="48" x2="386" y2="48" stroke="#1f1f1f"/>
<g>
  <text x="24" y="82" class="lbl">Total stars</text>
  <text x="236" y="82" class="val" text-anchor="end">40</text>
</g>
<g>
  <text x="24" y="110" class="lbl">Commits</text>
  <text x="236" y="110" class="val" text-anchor="end">2,607</text>
</g>
<g>
  <text x="24" y="138" class="lbl">Pull requests</text>
  <text x="236" y="138" class="val" text-anchor="end">442</text>
</g>
<g>
  <text x="24" y="166" class="lbl">Issues</text>
  <text x="236" y="166" class="val" text-anchor="end">132</text>
</g>
<g>
  <text x="24" y="194" class="lbl">Contributed to</text>
  <text x="236" y="194" class="val" text-anchor="end">5</text>
</g>
<line x1="268" y1="64" x2="268" y2="196" stroke="#1f1f1f"/>
<g transform="translate(339 124)">
  <circle r="46" fill="none" stroke="#161616" stroke-width="6"/>
  <circle r="46" fill="none" stroke="#ff3800" stroke-width="6" stroke-linecap="butt"
    stroke-dasharray="289.02652413026095" stroke-dashoffset="95.92757404183169" transform="rotate(-90)"/>
  <text y="10" text-anchor="middle" style="font:700 30px Satoshi, Inter, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ededed;letter-spacing:-.02em">A-</text>
</g>
<text x="339" y="198" class="sub" text-anchor="middle">TOP 33%</text>
</svg>