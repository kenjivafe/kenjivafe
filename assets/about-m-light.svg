<text x="16" y="170" class="p">intentional.</text>
<line x1="0" y1="199" x2="390" y2="199" stroke="#e8e8cf"/>
<line x1="0" y1="287" x2="390" y2="287" stroke="#e8e8cf"/>
<line x1="195" y1="199" x2="195" y2="375" stroke="#e8e8cf"/>
<text x="16" y="243" class="num">5<tspan class="sup" dy="-12">+</tspan></text>
<text x="16" y="263" class="sl">YEARS EXPERIENCE</text>
