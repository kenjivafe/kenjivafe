<svg xmlns="http://www.w3.org/2000/svg" width="390" height="375" viewBox="0 0 390 375" role="img" aria-label="About">
<style>
  .t{font:700 10px Satoshi, Inter, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.14em;fill:#606055}
  .tc{font:500 10px Satoshi, Inter, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.08em;fill:#8a8a7a}
