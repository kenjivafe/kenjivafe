<rect x=".5" y=".5" width="389" height="374" fill="#ffffe3" stroke="#e8e8cf"/>
<text x="16" y="29" class="t">ABOUT</text>
<text x="374" y="29" class="tc" text-anchor="end">KALINGA, PH</text>
<line x1="0" y1="48" x2="390" y2="48" stroke="#e8e8cf"/>
