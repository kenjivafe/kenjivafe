<rect x=".5" y=".5" width="829" height="259" fill="#10100e" stroke="#30302b"/>
<text x="24" y="29" class="t">ABOUT</text>
<text x="806" y="29" class="tc" text-anchor="end">KALINGA, PH</text>
<line x1="0" y1="48" x2="830" y2="48" stroke="#30302b"/>
<text x="24" y="92" class="p">I build precise, thoughtful digital products — from</text>
<text x="24" y="118" class="p">scalable backend architectures to fluid user interfaces.</text>
<text x="24" y="144" class="p">Focused on crafting software that feels effortless</text>
<text x="24" y="170" class="p">and intentional.</text>
<line x1="420" y1="48" x2="420" y2="260" stroke="#30302b"/>
<line x1="625" y1="48" x2="625" y2="260" stroke="#30302b"/>
<line x1="420" y1="154" x2="830" y2="154" stroke="#30302b"/>
<text x="448" y="110" class="num">5<tspan class="sup" dy="-16">+</tspan></text>
<text x="448" y="134" class="sl">YEARS EXPERIENCE</text>
